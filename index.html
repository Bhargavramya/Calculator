<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lalitha Naturals - Store Discount Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font & Tabular Numbers styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono-nums { font-variant-numeric: tabular-nums; }
        /* Custom scrollbar for items list */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto antialiased">

    <!-- Header -->
    <header class="flex justify-between items-center py-3 border-b border-zinc-800/80 mb-4">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold text-lg shadow-sm">
                🌿
            </div>
            <div>
                <h1 class="text-base font-bold tracking-tight text-white leading-tight">Lalitha Naturals</h1>
                <p class="text-[11px] font-medium text-zinc-400">Store Discount Calculator</p>
            </div>
        </div>
        <button onclick="toggleSettings()" class="p-2.5 bg-zinc-900 border border-zinc-800 hover:border-zinc-700 rounded-xl hover:bg-zinc-800 transition active:scale-95 text-zinc-300" aria-label="Settings">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Workspace -->
    <main class="space-y-4 flex-1">
        
        <!-- Settings Modal / Drawer -->
        <div id="settingsDrawer" class="hidden bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3 shadow-2xl transition-all">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-semibold text-zinc-300 uppercase tracking-wider">Manage Custom Percentages</h2>
                <span class="text-[10px] text-zinc-500">Saved to browser</span>
            </div>
            <div class="flex gap-2">
                <input type="number" id="newPercentageInput" placeholder="Enter % (e.g. 15)" class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 placeholder-zinc-600">
                <button onclick="addCustomPercentage()" class="bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold text-xs px-4 py-2 rounded-xl transition active:scale-95">Add</button>
            </div>
            <div id="customPercentagesList" class="flex flex-wrap gap-2 pt-1"></div>
        </div>

        <!-- Main Input Card -->
        <div class="bg-zinc-900/90 border border-zinc-800 rounded-3xl p-5 space-y-4 shadow-xl backdrop-blur-md">
            
            <!-- MRP Input Block -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label for="mrpInput" class="text-[11px] font-bold tracking-wider text-zinc-400 uppercase">MRP Amount</label>
                    <span class="text-[10px] text-zinc-500">INR (₹)</span>
                </div>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-zinc-500 font-bold text-2xl">₹</span>
                    <input type="number" id="mrpInput" placeholder="0" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl pl-10 pr-4 py-3 text-3xl font-mono-nums font-extrabold text-white focus:outline-none focus:border-emerald-500 transition text-right placeholder-zinc-700">
                </div>
            </div>

            <!-- Discount Selection Grid -->
            <div>
                <label class="block text-[11px] font-bold tracking-wider text-zinc-400 mb-2 uppercase">Select Discount</label>
                <div id="discountButtonsContainer" class="grid grid-cols-4 gap-2">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- Exchange Input Block -->
            <div>
                <label for="exchangeInput" class="block text-[11px] font-bold tracking-wider text-zinc-400 mb-1.5 uppercase">Exchange Value (Optional)</label>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-emerald-500/70 font-semibold text-lg">-₹</span>
                    <input type="number" id="exchangeInput" placeholder="0" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl pl-11 pr-4 py-2.5 text-xl font-mono-nums font-semibold text-emerald-400 focus:outline-none focus:border-emerald-500 transition text-right placeholder-zinc-700">
                </div>
            </div>

            <!-- Add Item Action Button -->
            <button onclick="addItem()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-extrabold py-3.5 rounded-2xl text-base tracking-wide transition shadow-lg shadow-emerald-500/10 active:scale-[0.98] flex items-center justify-center gap-2">
                <span>ADD ITEM</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6v12m6-6H6"></path></svg>
            </button>
        </div>

        <!-- Itemized List Container -->
        <div class="space-y-2">
            <div class="flex justify-between items-center text-xs font-semibold text-zinc-400 px-1">
                <span class="uppercase tracking-wider text-[10px]">Itemized Summary</span>
                <button onclick="clearAllItems()" class="text-rose-400 hover:text-rose-300 hover:underline text-[11px] font-medium transition">Clear All</button>
            </div>
            
            <div id="itemsListContainer" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                <!-- Dynamically populated items -->
            </div>
        </div>
    </main>

    <!-- Bottom Summary Bar Footer -->
    <footer class="mt-4 bg-zinc-900 border border-zinc-800 rounded-3xl p-4 space-y-2 shadow-2xl">
        <div class="flex justify-between text-xs text-zinc-400 font-mono-nums px-1">
            <span>Items Count: <strong id="totalCount" class="text-zinc-100 font-bold">0</strong></span>
            <span>Total MRP: ₹<strong id="totalMrp" class="text-zinc-100 font-bold">0.00</strong></span>
        </div>
        <div class="flex justify-between items-baseline pt-2 border-t border-zinc-800/80 px-1">
            <span class="text-xs font-bold uppercase tracking-wider text-zinc-400">Final Payable</span>
            <span class="text-3xl font-extrabold font-mono-nums text-emerald-400" id="grandTotal">₹0.00</span>
        </div>
    </footer>

    <!-- Calculator Application Logic -->
    <script>
        let items = JSON.parse(localStorage.getItem('lalitha_calc_items')) || [];
        let customDiscounts = JSON.parse(localStorage.getItem('lalitha_custom_discounts')) || [];
        let selectedDiscount = 20;

        function saveState() {
            localStorage.setItem('lalitha_calc_items', JSON.stringify(items));
            localStorage.setItem('lalitha_custom_discounts', JSON.stringify(customDiscounts));
        }

        function setDiscount(val) {
            selectedDiscount = val;
            
            // Reset all discount buttons styling
            document.querySelectorAll('.disc-btn').forEach(b => {
                b.className = 'disc-btn py-2.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 text-zinc-300 font-bold font-mono-nums transition border border-zinc-800 text-sm';
            });

            const customInput = document.getElementById('customDiscInput');
            if (customInput && val !== parseFloat(customInput.value)) {
                customInput.value = '';
                customInput.classList.remove('border-emerald-500', 'text-emerald-400');
                customInput.classList.add('border-zinc-800');
            }
            
            if (val !== null) {
                const activeBtn = document.getElementById(`btn-${val}`);
                if (activeBtn) {
                    activeBtn.className = 'disc-btn py-2.5 rounded-xl bg-emerald-500 text-zinc-950 font-extrabold font-mono-nums transition border border-emerald-400 shadow-md shadow-emerald-500/10 text-sm';
                }
            }
        }

        function setCustomDiscount(val) {
            if (val && !isNaN(parseFloat(val))) {
                selectedDiscount = parseFloat(val);
                document.querySelectorAll('.disc-btn').forEach(b => {
                    b.className = 'disc-btn py-2.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 text-zinc-300 font-bold font-mono-nums transition border border-zinc-800 text-sm';
                });
                const customInput = document.getElementById('customDiscInput');
                if (customInput) {
                    customInput.classList.remove('border-zinc-800');
                    customInput.classList.add('border-emerald-500', 'text-emerald-400');
                }
            }
        }

        function toggleSettings() {
            const drawer = document.getElementById('settingsDrawer');
            drawer.classList.toggle('hidden');
            renderCustomPercentages();
        }

        function addCustomPercentage() {
            const val = parseFloat(document.getElementById('newPercentageInput').value);
            if (!isNaN(val) && val > 0 && !customDiscounts.includes(val)) {
                customDiscounts.push(val);
                document.getElementById('newPercentageInput').value = '';
                saveState();
                renderCustomPercentages();
                renderDiscountButtons();
            }
        }

        function removeCustomPercentage(val) {
            customDiscounts = customDiscounts.filter(d => d !== val);
            saveState();
            renderCustomPercentages();
            renderDiscountButtons();
        }

        function renderCustomPercentages() {
            const container = document.getElementById('customPercentagesList');
            container.innerHTML = customDiscounts.map(d => `
                <span class="inline-flex items-center gap-1.5 bg-zinc-950 text-xs text-zinc-300 px-3 py-1.5 rounded-xl border border-zinc-800 font-mono-nums">
                    ${d}% 
                    <button onclick="removeCustomPercentage(${d})" class="text-rose-400 hover:text-rose-300 ml-1 font-bold">✕</button>
                </span>
            `).join('') || '<span class="text-xs text-zinc-500">No custom percentages added.</span>';
        }

        function renderDiscountButtons() {
            const container = document.getElementById('discountButtonsContainer');
            let html = `
                <button onclick="setDiscount(20)" id="btn-20" class="disc-btn py-2.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 text-zinc-300 font-bold font-mono-nums transition border border-zinc-800 text-sm">20%</button>
                <button onclick="setDiscount(40)" id="btn-40" class="disc-btn py-2.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 text-zinc-300 font-bold font-mono-nums transition border border-zinc-800 text-sm">40%</button>
                <button onclick="setDiscount(0)" id="btn-0" class="disc-btn py-2.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 text-zinc-300 font-bold transition border border-zinc-800 text-xs uppercase">None</button>
            `;
            
            customDiscounts.forEach(d => {
                html += `<button onclick="setDiscount(${d})" id="btn-${d}" class="disc-btn py-2.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 text-zinc-300 font-bold font-mono-nums transition border border-zinc-800 text-sm">${d}%</button>`;
            });

            html += `<input type="number" id="customDiscInput" placeholder="Custom %" oninput="setCustomDiscount(this.value)" class="bg-zinc-950 border border-zinc-800 rounded-xl text-center text-xs font-bold text-white focus:outline-none focus:border-emerald-500 placeholder-zinc-600">`;

            container.innerHTML = html;
            setDiscount(selectedDiscount);
        }

        function addItem() {
            const mrp = parseFloat(document.getElementById('mrpInput').value);
            const exchange = parseFloat(document.getElementById('exchangeInput').value) || 0;
            
            if (isNaN(mrp) || mrp <= 0) return;

            const discAmount = (mrp * selectedDiscount) / 100;
            const finalPrice = Math.max(0, mrp - discAmount - exchange);

            items.unshift({
                mrp: mrp,
                discountPercent: selectedDiscount,
                exchange: exchange,
                final: finalPrice
            });

            document.getElementById('mrpInput').value = '';
            document.getElementById('exchangeInput').value = '';
            document.getElementById('mrpInput').focus();

            saveState();
            renderItems();
        }

        function deleteItem(index) {
            items.splice(index, 1);
            saveState();
            renderItems();
        }

        function clearAllItems() {
            items = [];
            saveState();
            renderItems();
        }

        function renderItems() {
            const container = document.getElementById('itemsListContainer');
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-6 text-xs text-zinc-500 bg-zinc-900/40 rounded-2xl border border-zinc-800/50 flex flex-col items-center justify-center gap-1">
                        <svg class="w-6 h-6 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        <span>No items in list</span>
                    </div>`;
            } else {
                container.innerHTML = items.map((item, idx) => `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex justify-between items-center text-sm shadow-sm hover:border-zinc-700 transition">
                        <div class="space-y-1">
                            <div class="font-mono-nums font-extrabold text-base text-white">₹${item.final.toFixed(2)}</div>
                            <div class="text-[11px] text-zinc-400 flex items-center gap-1.5 flex-wrap">
                                <span>MRP: ₹${item.mrp.toFixed(2)}</span>
                                <span class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded-md font-semibold text-[10px] font-mono-nums">${item.discountPercent}% OFF</span>
                                ${item.exchange > 0 ? `<span class="bg-rose-500/10 border border-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded-md font-semibold text-[10px] font-mono-nums">Ex: -₹${item.exchange}</span>` : ''}
                            </div>
                        </div>
                        <button onclick="deleteItem(${idx})" class="text-zinc-500 hover:text-rose-400 p-2 rounded-lg hover:bg-zinc-800 transition" aria-label="Delete item">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                `).join('');
            }

            let totalMrp = items.reduce((sum, i) => sum + i.mrp, 0);
            let grandTotal = items.reduce((sum, i) => sum + i.final, 0);

            document.getElementById('totalCount').innerText = items.length;
            document.getElementById('totalMrp').innerText = totalMrp.toFixed(2);
            document.getElementById('grandTotal').innerText = `₹${grandTotal.toFixed(2)}`;
        }

        // Initialize application state on page load
        renderDiscountButtons();
        renderItems();
    </script>
</body>
</html>
